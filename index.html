<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FMCG Distributor Dashboard</title>
    <link rel="stylesheet" href="/src/css/styles.css" />
  </head>

  <body>
  <header id="site-header"></header>

  <main id="app">
  <h1>FMCG Distributor Dashboard</h1>

  <section class="executive-summary">
  <h2>Executive Summary</h2>

  <table class="exec-table">
    <thead>
      <tr>
        <th>Metric</th>
        <th>Actual</th>
        <th>Target / Optimal</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Total Sales</td>
        <td id="total-sales">—</td>
        <td>50,000</td>
        <td class="status" id="sales-status"></td>
      </tr>
      <tr>
        <td>Total Stock</td>
        <td id="total-stock">—</td>
        <td>30,000</td>
        <td class="status" id="stock-status"></td>
      </tr>
      <tr>
        <td>Empties Outstanding</td>
        <td id="total-empties">—</td>
        <td>10,000 (Max)</td>
        <td class="status" id="empties-status"></td>
      </tr>
    </tbody>
  </table>
  </section>
  
  <section class="kpi-container" id="kpi-cards"></section>

  <section class="chart-section">
  <h2>Performance Overview (Sales vs Stock by Brand)</h2>
  <canvas id="performanceChart" height="260"></canvas>
  </section>

</main>

  <footer id="site-footer"></footer>

  <script type="module" src="/src/js/main.js"></script>
</body>

</html>
